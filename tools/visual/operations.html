<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告与运营回归</title>
<style>body{margin:0;background:#101820;color:#eee;font:14px system-ui}main{display:flex;gap:24px;padding:16px}#app{width:390px;height:844px;position:relative;flex:none}canvas{display:block}aside{max-width:320px}button,select{font:inherit;padding:8px;margin:4px;background:#243444;color:white;border:1px solid #597080;border-radius:6px}output{display:block;white-space:pre-wrap;line-height:1.8}.native{position:absolute;background:#29384e;border:1px solid #82b7c9;box-sizing:border-box;display:grid;place-items:center;z-index:5;text-align:center;white-space:pre-line}.native[hidden]{display:none}.video{inset:60px 15px;background:#19282f} @media(max-width:650px){main{padding:0;flex-direction:column;gap:0}aside{padding:16px}}</style></head>
<body><main><div id="app"></div><aside><p>开发回归：本页使用模拟 SDK，无真实广告、收入或推荐。</p><select id="size"><option>390×844</option><option>360×640</option><option>375×812</option></select><select id="configuration"><option value="configured">模拟已配置</option><option value="empty">全部留空</option></select><p><button id="menu">选关</button><button id="playing">游玩</button><button id="supply">补给提示</button><button id="win">通关</button><button id="lose">爱心用尽</button><button id="community">攻略交流</button></p><p><button id="complete">完整看完</button><button id="cancel">提前关闭</button><button id="back">关闭运营页面</button></p><output id="status">加载中</output></aside></main><script type="module" src="/tools/visual/operations.ts"></script></body></html>
